name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Reproduce Phase 1 report
        run: contextops-lab offline-benchmark
      - name: Reproduce Phase 2 decision artifacts
        run: contextops-lab phase-2
      - name: Run product preflight
        run: contextops-lab doctor
