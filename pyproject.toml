[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "contextops-lab"
version = "0.2.0"
description = "AI-agent context reliability, experimentation, and cost evaluation lab"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
contextops-lab = "contextops_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contextops_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
